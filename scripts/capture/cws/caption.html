<!doctype html><meta charset=utf-8><link rel=stylesheet href=base.css>
<!-- Promo video lower-third caption, 1280x720 transparent (rendered at DPR 1.5 for the 1920x1080 master by
     video-cards.sh, and scaled for the 1280x720 demo). ?t=<the caption> and optional ?n=<a smaller note line>.
     The assembler overlays it on its scene with overlay=enable='between(t,a,b)' (this ffmpeg has no drawtext).
     Tile indigo, so it reads on the article's paper colour and on the terminal's ink alike. -->
<style>html,body{background:transparent!important;width:1280px;height:720px}
.cap{position:absolute;left:56px;bottom:44px;max-width:1000px;padding:16px 24px 17px;border-radius:14px;
  background:rgba(52,65,198,.96);color:#fff;box-shadow:0 18px 40px -16px rgba(8,10,48,.55),0 0 0 1px rgba(255,255,255,.16)}
.cap p{font:600 27px/1.28 var(--sans);letter-spacing:-.01em}
.cap small{display:block;margin-top:6px;font:400 17px/1.3 var(--sans);color:rgba(255,255,255,.78)}
.cap code{font-size:.92em}</style>
<body><div class=cap><p id=t></p><small id=n hidden></small></div>
<script>
const q=new URLSearchParams(location.search), esc=(s)=>s.replace(/[&<>]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
const fmt=(s)=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
document.getElementById('t').innerHTML=fmt(q.get('t')||'');
if(q.get('n')){const n=document.getElementById('n');n.innerHTML=fmt(q.get('n'));n.hidden=false}
</script>
