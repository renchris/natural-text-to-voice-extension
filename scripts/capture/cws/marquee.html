     master icon with a thin white ring, so the tile separates from the same-gradient background. -->

.lock b{font:600 72px/1 var(--sans);letter-spacing:-.03em}
.tag{position:absolute;left:100px;top:320px;font:600 46px/1.1 var(--serif);letter-spacing:-.01em;color:rgba(255,255,255,.92)}
.shot{left:806px;top:108px;width:500px}</style>
